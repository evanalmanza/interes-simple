<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Interés Simple</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
    .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.1); width: 100%; max-width: 400px; }
    h1 { font-size: 22px; margin-top: 0; color: #1a3d6d; }
    label { display: block; margin-top: 14px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #1a3d6d; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #14305a; }
    #resultado { margin-top: 20px; padding: 14px; background: #eaf3ff; border-radius: 6px; font-size: 15px; display: none; line-height: 1.6; }
    .formula { font-size: 13px; color: #555; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de Interés Simple</h1>
    <p class="formula">Fórmula: I = C × i × t &nbsp;|&nbsp; Monto final M = C + I</p>

    <label for="capital">Capital inicial (C)</label>
    <input type="number" id="capital" min="0" step="any" placeholder="Ej: 1000000">

    <label for="tasa">Tasa de interés por período (i) en %</label>
    <input type="number" id="tasa" min="0" step="any" placeholder="Ej: 2">

    <label for="tiempo">Tiempo (t) en períodos</label>
    <input type="number" id="tiempo" min="0" step="any" placeholder="Ej: 12">

    <button onclick="calcular()">Calcular</button>
    <div id="resultado"></div>
  </div>

  <script>
    function calcular() {
      const C = parseFloat(document.getElementById("capital").value);
      const i = parseFloat(document.getElementById("tasa").value) / 100;
      const t = parseFloat(document.getElementById("tiempo").value);
      const out = document.getElementById("resultado");

      out.style.display = "block";
      if (isNaN(C) || isNaN(i) || isNaN(t) || C < 0 || i < 0 || t < 0) {
        out.textContent = "Por favor ingresa valores válidos en todos los campos.";
        return;
      }
      const interes = C * i * t;
      const monto = C + interes;
      const fmt = n => n.toLocaleString("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      out.innerHTML = "<strong>Interés ganado (I):</strong> $" + fmt(interes) +
                      "<br><strong>Monto final (M):</strong> $" + fmt(monto);
    }
  </script>
</body>
</html>
